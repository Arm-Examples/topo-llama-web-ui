services:
  llama-server:
    platform: linux/arm64
    build:
      context: ./llama-inference
      args:
        MODEL: ${MODEL:-bartowski/Qwen_Qwen3-30B-A3B-Instruct-2507-GGUF}
        MODEL_ENDPOINT: ${MODEL_ENDPOINT:-https://huggingface.co}
        TARGET_MEMORY_KIB: ${TARGET_MEMORY_KIB:-}
        CONTEXT_LENGTH: ${CONTEXT_LENGTH:-4096}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s

x-topo:
  name: "Topo llama.cpp WebUI Chat"
  description: |
    LLM chat application with Arm CPU inference provided by llama.cpp.

    This project demonstrates running large language models on CPU
    with inference provided by the llama.cpp server.

    The upstream Linux Arm64 image includes architecture-specific CPU
    backend variants for Armv8.0 baseline, Armv8.2 dot product/FP16/SVE,
    Armv8.6 int8 matrix multiply/SVE2, and Armv9.2 SME-capable CPUs.

    The stack includes:
    - llama.cpp
    - Qwen3-30B-A3B-Instruct-2507 with target-aware precision selection
    - Built-in web chat interface
    - No GPU required - pure CPU inference

    Topo supplies target memory; whichllm selects a precision during the build.

    Ideal for testing LLM workloads on Arm hardware without GPU dependencies
    while avoiding a source build during Topo Project deployment.

  deployment_success_message: |
    Topo llama.cpp WebUI Chat is starting.

    Run `topo ps` and wait until the llama-server service reports a healthy status.
    Then open http://<target-ip>:8080 in your browser to start chatting.

  args: &args
    MODEL:
      description: GGUF repository; defaults to Qwen3-30B-A3B-Instruct-2507 (MoE).
      example: bartowski/Qwen_Qwen3-30B-A3B-Instruct-2507-GGUF
      hints:
        meta.type:
          - huggingface.repo-id
        model.task: text-generation
        model.format: gguf
    TARGET_MEMORY_KIB:
      description: Total target memory in KiB; populated by configure --target.
      source:
        provider: topo.memory
        group: system-memory
        fact: memory.total
    CONTEXT_LENGTH:
      description: Context tokens for both memory estimation and inference (default 4096).
      example: "4096"
    MODEL_ENDPOINT:
      description: "Hugging Face API compatible endpoint for downloading models"
      default: "https://huggingface.co"
      example: "https://hf-mirror.com"
      hints:
        meta.type: huggingface.endpoint
  parameters: *args
